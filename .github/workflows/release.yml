name: Release

# Push a tag to ship:  bash scripts/release.sh 0.2.0
# Or run manually from the Actions tab to produce a test build (no Release published).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version for a manual test build (no Release is published)"
        required: false
        default: "0.0.0-dev"

permissions:
  contents: write   # lets the built-in GITHUB_TOKEN create the Release — no secret needed

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15   # full Xcode 16 / Swift 6, needed for the universal build
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Resolve version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

      - name: Stamp version into Info.plist
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.meta.outputs.version }}" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" Resources/Info.plist

      - name: Build universal app bundle
        run: UNIVERSAL=1 ./scripts/build-app.sh release

      - name: Verify architectures
        run: lipo -info Tab.app/Contents/MacOS/Tab

      - name: Package
        run: ditto -c -k --keepParent Tab.app "Tab-${{ steps.meta.outputs.version }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tab-app
          path: "Tab-*.zip"
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')   # only real tags publish
    runs-on: ubuntu-latest                        # download + release only; no build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse tags that aren't on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main — refusing to publish."
            exit 1
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Tab ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/**/*.zip
          body: |
            **Tab ${{ github.ref_name }}** — a fast Alt-Tab window switcher for macOS (Apple Silicon + Intel).

            ### Install
            1. Download `Tab-*.zip`, unzip, and move **Tab.app** to `/Applications`.
            2. Clear quarantine once (this build isn't notarized):
               ```
               xattr -dr com.apple.quarantine /Applications/Tab.app
               ```
            3. Open Tab; allow **Accessibility** and **Screen Recording** when asked.
