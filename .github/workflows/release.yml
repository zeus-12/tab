name: Release

# Cut a release by pushing a version tag:
#     git tag v0.2.0 && git push origin v0.2.0
# …or run this workflow manually from the Actions tab (provide the version).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0 (creates tag v0.2.0)"
        required: true

permissions:
  contents: write   # required to create the GitHub Release

jobs:
  release:
    runs-on: macos-15   # full Xcode 16 / Swift 6, needed for the universal build
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Resolve version and tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            TAG="v${VERSION}"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG (version $VERSION)"

      - name: Stamp version into Info.plist
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.meta.outputs.version }}" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" Resources/Info.plist

      - name: Build universal app bundle
        run: UNIVERSAL=1 ./scripts/build-app.sh release

      - name: Verify architectures
        run: lipo -info Tab.app/Contents/MacOS/Tab

      - name: Package
        run: ditto -c -k --keepParent Tab.app "Tab-${{ steps.meta.outputs.version }}.zip"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Tab ${{ steps.meta.outputs.version }}
          generate_release_notes: true
          files: Tab-${{ steps.meta.outputs.version }}.zip
          body: |
            **Tab ${{ steps.meta.outputs.version }}** — a fast Alt-Tab window switcher for macOS (Apple Silicon + Intel).

            ### Install
            1. Download `Tab-${{ steps.meta.outputs.version }}.zip`, unzip, and move **Tab.app** to `/Applications`.
            2. This build isn't notarized yet, so macOS quarantines downloaded apps. Clear it once:
               ```
               xattr -dr com.apple.quarantine /Applications/Tab.app
               ```
            3. Launch Tab, then grant **Accessibility** and **Screen Recording** when prompted.
